<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="804" viewBox="0 0 1040 804" role="img" aria-labelledby="title description"><title id="title">공개 데이터의 DB 구조</title><desc id="description">공식 자료를 D1의 여섯 분야와 정적 JSON에 저장하고 연결 근거와 공개 버전을 통해 웹과 MCP에서 조회하는 논리 구조도</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7188a0"/></marker></defs><style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#16324c}.title{font-size:28px;font-weight:700}.subtitle{font-size:16px;fill:#526b82}.heading{font-size:20px;font-weight:700}.body{font-size:17px}.code{font-size:14px;fill:#526b82}.small{font-size:15px;fill:#526b82}.step{font-size:14px;font-weight:700;fill:#087f72}</style><rect width="1040" height="804" fill="#f5f8fc"/><text x="40" y="52" class="title" text-anchor="start">DB 구조 · 출처와 시점을 함께 보관</text><text x="40" y="82" class="subtitle" text-anchor="start">공식 자료 → 분야별 저장 → 근거와 공개 버전 → 웹·MCP</text><rect x="40" y="108" width="960" height="64" rx="14" fill="#e7f4f1" stroke="#b9ddd3"/><text x="520" y="136" class="heading" text-anchor="middle">공식 공개 자료의 수집 · 정규화 · 검증</text><text x="520" y="158" class="small" text-anchor="middle">출처 / 지역 / 기준일 / 회계연도 / 단위를 함께 기록</text><text x="40" y="208" class="heading" text-anchor="start">D1 데이터베이스</text><text x="1000" y="208" class="small" text-anchor="end">각 분야의 이력을 구분해 저장</text><path d="M520 172 V186 H200 V227" fill="none" stroke="#7188a0" stroke-width="2"  marker-end="url(#arrow)"/><path d="M520 186 V227" fill="none" stroke="#7188a0" stroke-width="2"  marker-end="url(#arrow)"/><path d="M520 186 H840 V227" fill="none" stroke="#7188a0" stroke-width="2"  marker-end="url(#arrow)"/><rect x="40" y="230" width="300" height="134" rx="14" fill="#fff" stroke="#d2dfeb"/><text x="60" y="262" class="heading" text-anchor="start">사업 · 공식 원문</text><text x="60" y="291" class="body" text-anchor="start">수집 버전을 함께 참조</text><text x="60" y="335" class="code" text-anchor="start">official_service_snapshot</text><text x="60" y="353" class="code" text-anchor="start">official_source_document</text><rect x="370" y="230" width="300" height="134" rx="14" fill="#fff" stroke="#d2dfeb"/><text x="390" y="262" class="heading" text-anchor="start">매뉴얼</text><text x="390" y="291" class="body" text-anchor="start">자료집 버전 → 문서 → 절</text><text x="390" y="335" class="code" text-anchor="start">manual_corpus / manual_document</text><text x="390" y="353" class="code" text-anchor="start">manual_section</text><rect x="700" y="230" width="300" height="134" rx="14" fill="#fff" stroke="#d2dfeb"/><text x="720" y="262" class="heading" text-anchor="start">예산</text><text x="720" y="291" class="body" text-anchor="start">사업 → 금액 관측값</text><text x="720" y="335" class="code" text-anchor="start">fiscal_project / fiscal_observation</text><text x="720" y="353" class="code" text-anchor="start">fiscal_snapshot</text><rect x="40" y="386" width="300" height="134" rx="14" fill="#fff" stroke="#d2dfeb"/><text x="60" y="418" class="heading" text-anchor="start">뉴스</text><text x="60" y="447" class="body" text-anchor="start">기관 → 수집원 → 게시물</text><text x="60" y="491" class="code" text-anchor="start">press_organization / press_source</text><text x="60" y="509" class="code" text-anchor="start">press_item</text><rect x="370" y="386" width="300" height="134" rx="14" fill="#fff" stroke="#d2dfeb"/><text x="390" y="418" class="heading" text-anchor="start">문서의 근거</text><text x="390" y="447" class="body" text-anchor="start">문서 → 사실 → 근거 위치</text><text x="390" y="491" class="code" text-anchor="start">doc_source / doc_statement</text><text x="390" y="509" class="code" text-anchor="start">doc_evidence</text><rect x="700" y="386" width="300" height="134" rx="14" fill="#fff" stroke="#d2dfeb"/><text x="720" y="418" class="heading" text-anchor="start">외부 연계 · 통계</text><text x="720" y="447" class="body" text-anchor="start">데이터셋 → 수집 실행 → 기록</text><text x="720" y="491" class="code" text-anchor="start">ext_dataset / ext_run / ext_record</text><text x="720" y="509" class="code" text-anchor="start">지역 코드 · 통계 관측값</text><rect x="40" y="540" width="960" height="68" rx="14" fill="#edf2fb" stroke="#cbd8ed"/><text x="60" y="569" class="heading" text-anchor="start">분야 간 연결 근거 · 공개할 자료 버전</text><text x="60" y="593" class="code" text-anchor="start">cross_domain_link  /  platform_release_bundle</text><path d="M520 520 V537" fill="none" stroke="#7188a0" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="40" y="632" width="460" height="76" rx="14" fill="#fff" stroke="#d2dfeb"/><text x="60" y="662" class="heading" text-anchor="start">정적 JSON · 문서 자료</text><text x="60" y="689" class="body" text-anchor="start">복지제도 대장 · 업무구조도 · 매뉴얼 자료</text><rect x="540" y="632" width="460" height="76" rx="14" fill="#e7f4f1" stroke="#b9ddd3"/><text x="770" y="662" class="heading" text-anchor="middle">공통 조회 → 웹 화면 · MCP</text><text x="770" y="689" class="body" text-anchor="middle">출처와 기준 시점을 함께 제공</text><path d="M770 608 V629" fill="none" stroke="#7188a0" stroke-width="2"  marker-end="url(#arrow)"/><path d="M500 670 H537" fill="none" stroke="#7188a0" stroke-width="2"  marker-end="url(#arrow)"/><text x="40" y="744" class="small" text-anchor="start">읽는 법: 화살표는 논리적 자료 흐름입니다. 모든 연결이 DB 외래키를 뜻하지는 않습니다.</text><text x="40" y="771" class="small" text-anchor="start">검색 후보와 확인된 연결은 구분하며, 이름이 비슷하다는 이유만으로 관계를 확정하지 않습니다.</text></svg>

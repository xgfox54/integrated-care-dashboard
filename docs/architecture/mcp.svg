<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="730" viewBox="0 0 1040 730" role="img" aria-labelledby="title description"><title id="title">Korean Welfare MCP의 조회 흐름</title><desc id="description">이용자 질문, AI 클라이언트, 입력 확인, 분야별 도구, 공개 자료와 공식 통계, 출처를 포함한 결과의 순서</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7188a0"/></marker></defs><style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#16324c}.title{font-size:28px;font-weight:700}.subtitle{font-size:16px;fill:#526b82}.heading{font-size:20px;font-weight:700}.body{font-size:17px}.code{font-size:14px;fill:#526b82}.small{font-size:15px;fill:#526b82}.step{font-size:14px;font-weight:700;fill:#087f72}</style><rect width="1040" height="730" fill="#f5f8fc"/><text x="40" y="52" class="title" text-anchor="start">MCP 구조 · AI와 공개 자료를 연결</text><text x="40" y="82" class="subtitle" text-anchor="start">질문을 정해진 조회 도구로 바꾸고, 근거와 함께 결과를 돌려줍니다.</text><rect x="40" y="110" width="960" height="72" rx="14" fill="#fff" stroke="#d2dfeb"/><text x="62" y="135" class="step" text-anchor="start">01</text><text x="106" y="140" class="heading" text-anchor="start">이용자 → AI 클라이언트</text><text x="106" y="166" class="body" text-anchor="start">예: 서귀포시 생계지원 자료를 찾아줘  ·  ChatGPT / Claude 등</text><path d="M520 182 V201" fill="none" stroke="#7188a0" stroke-width="2"  marker-end="url(#arrow)"/><rect x="40" y="204" width="960" height="72" rx="14" fill="#fff" stroke="#d2dfeb"/><text x="62" y="229" class="step" text-anchor="start">02</text><text x="106" y="234" class="heading" text-anchor="start">Korean Welfare MCP 1.14.0 · 기본 노출 16개 · 전체 실행 32개</text><text x="106" y="260" class="body" text-anchor="start">입력 형식을 확인하고 지역·연도 등 조회 조건을 반영합니다.</text><path d="M520 276 V295" fill="none" stroke="#7188a0" stroke-width="2"  marker-end="url(#arrow)"/><rect x="40" y="298" width="960" height="72" rx="14" fill="#fff" stroke="#d2dfeb"/><text x="62" y="323" class="step" text-anchor="start">03</text><text x="106" y="328" class="heading" text-anchor="start">welfare_research · 자동 상세 조회 · 전문 도구 탐색</text><text x="106" y="354" class="body" text-anchor="start">복지제도 / 매뉴얼·FAQ / 예산 / 뉴스 / 통계 · 돌봄자원·법령 도구 제외</text><path d="M520 370 V389 H275 V405" fill="none" stroke="#7188a0" stroke-width="2"  marker-end="url(#arrow)"/><path d="M520 389 H765 V405" fill="none" stroke="#7188a0" stroke-width="2"  marker-end="url(#arrow)"/><rect x="40" y="408" width="470" height="92" rx="14" fill="#edf2fb" stroke="#cbd8ed"/><text x="275" y="443" class="heading" text-anchor="middle">공개된 저장 자료</text><text x="275" y="475" class="body" text-anchor="middle">D1 + 정적 JSON + 문서 자료</text><rect x="530" y="408" width="470" height="92" rx="14" fill="#edf2fb" stroke="#cbd8ed"/><text x="765" y="443" class="heading" text-anchor="middle">필요한 공식 통계 조회</text><text x="765" y="475" class="body" text-anchor="middle">자료별 제공 범위 안에서 조회</text><path d="M275 500 V521 H520 V539" fill="none" stroke="#7188a0" stroke-width="2"  marker-end="url(#arrow)"/><path d="M765 500 V521 H520" fill="none" stroke="#7188a0" stroke-width="2"  marker-end="url(#arrow)"/><rect x="40" y="542" width="960" height="88" rx="14" fill="#e7f4f1" stroke="#b9ddd3"/><text x="62" y="570" class="step" text-anchor="start">04</text><text x="106" y="572" class="heading" text-anchor="start">구조화된 결과 → AI의 설명과 원문 링크</text><text x="106" y="601" class="body" text-anchor="start">자료 + 출처 + 기준 시점 + 자료 버전 + 누락·주의사항</text><text x="40" y="668" class="small" text-anchor="start">이용자는 조회 도구를 사용합니다. 서버 내부의 자료 현행화·검색 캐시와는 별도 흐름입니다.</text><text x="40" y="695" class="small" text-anchor="start">AI의 설명은 수급 자격 판정이 아닙니다. 이용자가 원문의 조건·예외와 최신 기준을 확인합니다.</text></svg>
